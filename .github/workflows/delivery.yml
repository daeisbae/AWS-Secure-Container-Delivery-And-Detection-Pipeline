name: Delivery

on:
  workflow_run:
    workflows:
      - Testing
    types:
      - completed
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

env:
  COSIGN_VERSION: "v3.0.6"
  LOCAL_IMAGE: "secure-container-pipeline:candidate"
  TERRAFORM_VERSION: "1.14.6"
  AWS_PAGER: ""

jobs:
  infrastructure:
    name: Apply infrastructure
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: infrastructure-${{ vars.HCP_TERRAFORM_WORKSPACE }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
      AWS_TERRAFORM_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ vars.HCP_TERRAFORM_ORGANIZATION }}
      TF_WORKSPACE: ${{ vars.HCP_TERRAFORM_WORKSPACE }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ca-central-1' }}
      TF_VAR_github_oidc_subject: ${{ vars.AWS_DELIVERY_OIDC_SUBJECT }}
      TF_VAR_manage_github_oidc_provider: ${{ vars.MANAGE_GITHUB_OIDC_PROVIDER || 'false' }}
      TF_VAR_allowed_cidr_blocks: ${{ vars.ALLOWED_CIDR_BLOCKS || '[]' }}
      TF_IN_AUTOMATION: "true"
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    outputs:
      aws_region: ${{ steps.terraform_outputs.outputs.aws_region }}
      ecr_repository: ${{ steps.terraform_outputs.outputs.ecr_repository }}
      ecs_cluster: ${{ steps.terraform_outputs.outputs.ecs_cluster }}
      ecs_service: ${{ steps.terraform_outputs.outputs.ecs_service }}
      task_family: ${{ steps.terraform_outputs.outputs.task_family }}
      delivery_role_arn: ${{ steps.terraform_outputs.outputs.delivery_role_arn }}

    steps:
      - name: Validate infrastructure configuration
        id: config
        run: |
          for name in \
            AWS_REGION \
            AWS_TERRAFORM_ROLE_ARN \
            TF_TOKEN_app_terraform_io \
            TF_CLOUD_ORGANIZATION \
            TF_WORKSPACE \
            TF_VAR_github_oidc_subject; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Infrastructure setting $name is unset."
              exit 1
            fi
          done

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The triggering Testing run has an invalid commit SHA."
            exit 1
          fi

          account_id="$(cut -d: -f5 <<< "$AWS_TERRAFORM_ROLE_ARN")"
          if [[ ! "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_TERRAFORM_ROLE_ARN has no valid account ID."
            exit 1
          fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Refuse a stale main deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')"
          if [[ "$current_main_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::A newer main commit exists; this infrastructure will not apply."
            exit 1
          fi

      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure short-lived AWS infrastructure credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ steps.config.outputs.account_id }}
          role-session-name: Terraform-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          mask-aws-account-id: false
          unset-current-credentials: true

      - name: Plan infrastructure
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform validate -no-color
          terraform -chdir=terraform plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -out="$RUNNER_TEMP/infrastructure.tfplan"

      - name: Apply infrastructure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')"
          if [[ "$current_main_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::Main changed while Terraform was planning."
            exit 1
          fi

          terraform -chdir=terraform apply \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            "$RUNNER_TEMP/infrastructure.tfplan"

      - name: Read deployment configuration from Terraform
        id: terraform_outputs
        run: |
          {
            echo "aws_region=$(terraform -chdir=terraform output -raw aws_region)"
            echo "ecr_repository=$(terraform -chdir=terraform output -raw ecr_repository_name)"
            echo "ecs_cluster=$(terraform -chdir=terraform output -raw ecs_cluster_name)"
            echo "ecs_service=$(terraform -chdir=terraform output -raw ecs_service_name)"
            echo "task_family=$(terraform -chdir=terraform output -raw task_definition_family)"
            echo "delivery_role_arn=$(terraform -chdir=terraform output -raw github_delivery_role_arn)"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Sign and deploy digest
    needs: infrastructure
    if: >-
      ${{
        needs.infrastructure.result == 'success' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    concurrency:
      group: production-${{ needs.infrastructure.outputs.ecs_cluster }}-${{ needs.infrastructure.outputs.ecs_service }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ needs.infrastructure.outputs.aws_region }}
      AWS_ROLE_ARN: ${{ needs.infrastructure.outputs.delivery_role_arn }}
      ECR_REPOSITORY: ${{ needs.infrastructure.outputs.ecr_repository }}
      ECS_CLUSTER: ${{ needs.infrastructure.outputs.ecs_cluster }}
      ECS_SERVICE: ${{ needs.infrastructure.outputs.ecs_service }}
      TASK_FAMILY: ${{ needs.infrastructure.outputs.task_family }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      DEPLOY_REPORT_DIR: deploy-reports

    steps:
      - name: Validate deployment configuration
        id: config
        run: |
          mkdir -p "$DEPLOY_REPORT_DIR"
          for name in \
            AWS_REGION \
            AWS_ROLE_ARN \
            ECR_REPOSITORY \
            ECS_CLUSTER \
            ECS_SERVICE \
            TASK_FAMILY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Production variable $name is unset."
              exit 1
            fi
          done

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] ||
             [[ ! "$SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "::error::The triggering Testing run has invalid provenance."
            exit 1
          fi
          printf '%s\n' "$SOURCE_SHA" > "$DEPLOY_REPORT_DIR/source-sha.txt"
          printf '%s\n' "$SOURCE_RUN_ID" > "$DEPLOY_REPORT_DIR/source-run-id.txt"
          printf '%s\n' "$SOURCE_RUN_ATTEMPT" \
            > "$DEPLOY_REPORT_DIR/source-run-attempt.txt"

          account_id="$(cut -d: -f5 <<< "$AWS_ROLE_ARN")"
          if [[ ! "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ROLE_ARN has no valid account ID."
            exit 1
          fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Refuse a stale main deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')"
          if [[ "$current_main_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::A newer main commit exists; this image will not deploy."
            exit 1
          fi

      - name: Download approved image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approved-image-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/approved-image
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Verify and load approved image
        run: |
          package_dir="$RUNNER_TEMP/approved-image"
          artifact_source_sha="$(<"$package_dir/source-sha.txt")"
          if [[ "$artifact_source_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::The approved image belongs to a different commit."
            exit 1
          fi
          (
            cd "$package_dir"
            sha256sum --check image.tar.sha256
          )

          docker load --input "$package_dir/image.tar"
          expected_image_id="$(<"$package_dir/image-id.txt")"
          actual_image_id="$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')"
          if [[ "$actual_image_id" != "$expected_image_id" ]]; then
            echo "::error::The loaded image ID differs from the scanned image."
            exit 1
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ steps.config.outputs.account_id }}
          role-session-name: GitHub-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Push image and resolve digest
        id: publish
        env:
          EXPECTED_ACCOUNT_ID: ${{ steps.config.outputs.account_id }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != "$EXPECTED_ACCOUNT_ID" ]]; then
            echo "::error::The assumed role belongs to the wrong AWS account."
            exit 1
          fi

          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          image_uri="$registry/$ECR_REPOSITORY"
          release_tag="$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_tag="$image_uri:$release_tag"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$registry"
          docker tag "$LOCAL_IMAGE" "$remote_tag"
          docker push "$remote_tag" \
            2>&1 | tee "$DEPLOY_REPORT_DIR/ecr-push.log"

          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$release_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ECR returned an invalid image digest."
            exit 1
          fi

          image_ref="$image_uri@$digest"
          printf '%s\n' "$image_ref" > "$DEPLOY_REPORT_DIR/image-ref.txt"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Sign and verify image digest
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          expected_identity="$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF"
          cosign verify \
            --certificate-identity "$expected_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --output json \
            "$IMAGE_REF" \
            | tee "$DEPLOY_REPORT_DIR/cosign-verify.json"

      - name: Register digest-pinned task definition
        id: task_definition
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          current_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query taskDefinition \
            > "$DEPLOY_REPORT_DIR/task-definition-current.json"

          jq -e \
            --arg family "$TASK_FAMILY" \
            '.family == $family and
             ([.containerDefinitions[] | select(.name == "app")] | length) == 1' \
            "$DEPLOY_REPORT_DIR/task-definition-current.json" >/dev/null

          jq \
            --arg image "$IMAGE_REF" \
            'del(
               .taskDefinitionArn,
               .taskRoleArn,
               .revision,
               .status,
               .requiresAttributes,
               .compatibilities,
               .registeredAt,
               .registeredBy,
               .deregisteredAt
             )
             | (.containerDefinitions[] | select(.name == "app")).image = $image' \
            "$DEPLOY_REPORT_DIR/task-definition-current.json" \
            > "$DEPLOY_REPORT_DIR/task-definition-rendered.json"

          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json "file://$DEPLOY_REPORT_DIR/task-definition-rendered.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Deploy task definition
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_DEFINITION_ARN: ${{ steps.task_definition.outputs.arn }}
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          current_main_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')"
          if [[ "$current_main_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::Main changed while the image was being signed."
            exit 1
          fi

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --desired-count 1 \
            > "$DEPLOY_REPORT_DIR/update-service.json"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          deployed_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          if [[ "$deployed_task_definition" != "$TASK_DEFINITION_ARN" ]]; then
            echo "::error::ECS became stable after rolling back the new task definition."
            exit 1
          fi
          aws ecs describe-task-definition \
            --task-definition "$deployed_task_definition" \
            --query taskDefinition \
            > "$DEPLOY_REPORT_DIR/task-definition-deployed.json"
          deployed_image="$(jq -er '
            [.containerDefinitions[] | select(.name == "app")]
            | if length == 1 then .[0].image else error("expected one app container") end
          ' "$DEPLOY_REPORT_DIR/task-definition-deployed.json")"
          if [[ "$deployed_image" != "$IMAGE_REF" ]]; then
            echo "::error::The stable ECS service does not reference the signed image digest."
            exit 1
          fi

          {
            echo "### Deployment"
            echo
            echo "Image: $IMAGE_REF"
            echo
            echo "Task definition: $TASK_DEFINITION_ARN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEPLOY_REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
